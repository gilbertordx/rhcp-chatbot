[package]
name = "rhcp-chatbot"
version = "0.1.0"
edition = "2024"
description = "Rust remaster of the RHCP trivia chatbot (NLP pipeline, API and CLI)"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.9", features = ["derive"] }
dotenvy = "0.15.7"
fancy-regex = "0.20.2"
indexmap = { version = "2.14.2", features = ["serde"] }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
rand = "0.10.4"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v4"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
